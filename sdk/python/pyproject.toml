[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logllama"
version = "0.1.0"
description = "LLM observability in two lines of Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LogLlama" }]
license = { text = "Proprietary. All rights reserved." }
keywords = ["llm", "observability", "openai", "debugging", "telemetry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/logllama/logllama"
Repository = "https://github.com/logllama/logllama"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-genai>=1.0.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
]
test = [
    "openai>=1.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that can call external services and require explicit opt-in",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["logllama*"]
