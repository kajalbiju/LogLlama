name: SDK Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_provider_e2e:
        description: Run 5 real OpenAI and 5 real Gemini calls through Provider-tab credentials
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run safe SDK tests
        run: python -m pytest tests -q

  provider-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_provider_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logllama
          POSTGRES_PASSWORD: logllama
          POSTGRES_DB: logllama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logllama -d logllama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK provider and test dependencies
        working-directory: sdk/python
        run: python -m pip install -e ".[openai,gemini,test]"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Require provider secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" && test -n "$GEMINI_API_KEY" || {
            echo "OPENAI_API_KEY and GEMINI_API_KEY secrets are required."
            exit 1
          }
      - name: Generate CI account password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "LOGLLAMA_PROVISION_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "LOGLLAMA_DASHBOARD_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Bootstrap persistent OpenBao
        working-directory: .
        run: scripts/openbao-local-bootstrap.sh
      - name: Migrate and start LogLlama backend with OpenBao
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://logllama:logllama@localhost:5432/logllama
        run: |
          set -a
          source ../.openbao/backend.env
          set +a
          python -m alembic upgrade head
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/logllama-backend.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/logllama-backend.log
          exit 1
      - name: Provision CI account, project, keys, and provider credentials
        working-directory: .
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/provision_local.py \
            --endpoint http://127.0.0.1:8000 \
            --email ci@logllama.test \
            --organization "CI Integration" \
            --project "CI Integration" \
            --credential openai=OPENAI_API_KEY \
            --credential gemini=GEMINI_API_KEY \
            --format env >> "$GITHUB_ENV"
          unset OPENAI_API_KEY GEMINI_API_KEY
      - name: Verify OpenBao-backed runtime credentials
        working-directory: .
        run: |
          response="$(
            curl -fsS \
              -H "X-LogLlama-Runtime-Key: $LOGLLAMA_RUNTIME_KEY" \
              http://127.0.0.1:8000/v1/runtime/provider-credentials
          )"
          jq -e '
            ([.credentials[].provider] | index("openai") != null) and
            ([.credentials[].provider] | index("gemini") != null) and
            (all(.credentials[]; (.api_key | length) > 0))
          ' <<<"$response" >/dev/null
          echo "OpenAI and Gemini credentials loaded from OpenBao."
          unset response
      - name: Run 5 OpenAI and 5 Gemini Provider-tab calls
        env:
          RUN_LOGLLAMA_OPENAI_INTEGRATION: "1"
          LOGLLAMA_OPENAI_SUCCESS_RUNS: "5"
          RUN_LOGLLAMA_GEMINI_INTEGRATION: "1"
          LOGLLAMA_GEMINI_SUCCESS_RUNS: "5"
          LOGLLAMA_ENDPOINT: http://127.0.0.1:8000
          LOGLLAMA_OPENAI_TEST_MODEL: ${{ vars.LOGLLAMA_OPENAI_TEST_MODEL || 'gpt-5-nano' }}
          LOGLLAMA_GEMINI_TEST_MODEL: ${{ vars.LOGLLAMA_GEMINI_TEST_MODEL || 'gemini-3.5-flash-lite' }}
        working-directory: sdk/python
        run: |
          unset OPENAI_API_KEY GEMINI_API_KEY GOOGLE_API_KEY ANTHROPIC_API_KEY
          python -m pytest -q --durations=2 \
            tests/integration/test_openai_capture.py::test_valid_openai_managed_credentials_capture_bounded_billable_calls \
            tests/integration/test_gemini_capture.py::test_valid_gemini_managed_credentials_capture_bounded_calls
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: provider-e2e-backend-log
          path: /tmp/logllama-backend.log
