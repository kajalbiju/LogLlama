name: Backend Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: logllama
          POSTGRES_PASSWORD: logllama
          POSTGRES_DB: logllama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logllama -d logllama_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://logllama:logllama@localhost:5432/logllama_test
      # The migration step below reads DATABASE_URL, and the CI service only creates logllama_test.
      DATABASE_URL: postgresql+asyncpg://logllama:logllama@localhost:5432/logllama_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run migrations and backend tests
        run: python -m pytest -q
      - name: Check that the models match the migrated schema
        run: |
          python -m alembic upgrade head
          python -m alembic check
