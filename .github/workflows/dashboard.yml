name: Dashboard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Make sure no admin key is compiled into the browser bundle
        run: |
          if grep -R "X-LogLlama-Admin-Key\|VITE_LOGLLAMA_ADMIN_KEY" dist; then
            echo "The dashboard bundle still references the shared admin key."
            exit 1
          fi
